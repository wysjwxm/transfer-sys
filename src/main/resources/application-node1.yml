# 节点 1：拥有 userId % 2 == 1 的账户（种子 user 1、3）。
# 对外 API 需打到账户所在节点；跨片转出的协调者即转出方所在节点。
spring:
  datasource:
    url: jdbc:h2:file:./data/node1/transfer-sys;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      data-locations: classpath:data-node1.sql

# 节点身份与对端地址：shardOf(userId) = userId % 2，本节点持有 == node-id 的账户
transfer:
  node-id: 1
  peer-url: http://localhost:8080

server:
  port: 8081
