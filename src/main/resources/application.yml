# 双实例(微服务)分库版：本文件只放"两节点共用"的配置。
# 数据源/端口/节点身份/对端地址 由节点 profile 各自指定（application-node0.yml / application-node1.yml）：
#   node0 = userId % 2 == 0 的账户（种子 user 2、4），端口 8080，对端 8081
#   node1 = userId % 2 == 1 的账户（种子 user 1、3），端口 8081，对端 8080
spring:
  application:
    name: transfer-sys

  # H2 控制台（浏览器访问各自端口下的 /h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动即建表；种子数据按节点分别给（见各节点 profile 的 data-locations）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wysjwxm.domain.account,com.wysjwxm.domain.transfer
  configuration:
    map-underscore-to-camel-case: true

# 日志收敛：只看自己代码 + MyBatis 生成的 SQL（前缀即 com.wysjwxm）
logging:
  level:
    root: info
    com.wysjwxm: DEBUG
