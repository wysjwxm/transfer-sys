# 测试 profile：模拟"节点 1"(持有奇数账户 user 1、3)，只跑节点1视角的用例。
# 其余配置（schema.sql 建表、mybatis.mapper-locations、logging、h2 console）继承主 application.yml。
# 注意：这是 profile 文件，与主配置合并生效；若放成 src/test/resources/application.yml 同名文件，
# 会整体遮蔽主配置导致 mapper-locations 丢失、XML 不被加载（BindingException 根因，勿回退）。
spring:
  datasource:
    url: jdbc:h2:mem:transfer_test_node1;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      data-locations: classpath:data-node1.sql

transfer:
  node-id: 1
  # 单上下文测试不打真实对端（跨片用例用 @MockBean 假扮 TccPeer），此地址仅占位
  peer-url: http://localhost:19999
